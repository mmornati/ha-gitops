---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read  # checkout only; no job writes back

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        env:
          SHELLCHECK_OPTS: -x

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint .

  python:
    name: Lint, Types, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked --python 3.14
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Mypy (strict)
        run: uv run --no-sync mypy
      - name: Image requirements match the lock
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --no-annotate \
            | diff - <(grep -v '^# ' gitops_backup/requirements.txt)
      - name: Tests with coverage (fails under 95%)
        run: uv run --no-sync pytest

  addon-lint:
    name: App Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Home Assistant App Lint
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809  # v2.21.2
        with:
          path: ./gitops_backup

  build:
    name: Build (amd64 smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build app image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.24 \
            -t gitops-backup:test ./gitops_backup
      - name: Smoke — binaries present, no build tools left
        run: |
          docker run --rm --entrypoint sh gitops-backup:test \
            -c "command -v git && command -v inotifywait && ! command -v pip \
              && cd /app && python3 -c 'import aiohttp, paho.mqtt.client; \
                import ha_gitops.engine.runner, ha_gitops.controller.app; \
                print(aiohttp.__version__, paho.mqtt.__version__)'"
      - name: Tests inside the image (Alpine git, musl, the shipped Python)
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/src:ro gitops-backup:test -c "
            apk add --no-cache py3-pip >/dev/null &&
            pip install -q --break-system-packages \
              pytest==9.2.0 pytest-asyncio==1.5.0 pytest-cov==7.1.0 &&
            cp -r /src /work && cd /work && rm -rf .git .venv &&
            python3 -m pytest -p no:cacheprovider"
      - name: Trivy — image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: gitops-backup:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # tempio ships in the HA base image; not ours to patch.
          skip-files: /usr/bin/tempio
