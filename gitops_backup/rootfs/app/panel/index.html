<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA GitOps</title>
<style>
  :root {
    --bg: #f5f5f5; --card: #ffffff; --text: #212121; --muted: #6b6b6b;
    --line: #e0e0e0; --accent: #03a9f4; --ok: #2e7d32; --warn: #ef6c00; --err: #c62828;
    --code: #f3f3f3; --add: #e6ffec; --del: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
      --line: #2f2f2f; --accent: #4fc3f7; --ok: #66bb6a; --warn: #ffa726; --err: #ef5350;
      --code: #161616; --add: #12301b; --del: #3a1517;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600;
          border: 1px solid currentColor; font-size: 12px; }
  .success { color: var(--ok); } .warning, .pending, .running { color: var(--warn); }
  .error, .failure { color: var(--err); } .unknown, .none { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.sha { font-family: ui-monospace, monospace; white-space: nowrap; }
  pre { background: var(--code); border-radius: 8px; padding: 12px; margin: 0; overflow: auto;
        max-height: 480px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .add { background: var(--add); display: block; } .del { background: var(--del); display: block; }
  .muted { color: var(--muted); }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>HA GitOps</h1>
    <div class="actions">
      <button class="primary" data-cmd="sync">Sync now</button>
      <button data-cmd="backup">Back up now</button>
      <button data-cmd="dry_run">Dry run</button>
      <button id="pause"></button>
      <button id="apply"></button>
    </div>
  </div>

  <section class="card">
    <h2>Status <span id="state" class="pill unknown">…</span></h2>
    <div class="grid" id="stats"></div>
  </section>

  <section class="card">
    <h2>Pending changes on the box</h2>
    <div id="files" class="muted">Loading…</div>
    <details style="margin-top:8px"><summary>Diff</summary><pre id="diff"></pre></details>
  </section>

  <section class="card">
    <div class="tabs">
      <button data-tab="history" aria-selected="true">History</button>
      <button data-tab="log" aria-selected="false">Log</button>
    </div>
    <div id="tab-history"><table id="history"></table></div>
    <div id="tab-log" hidden><pre id="log"></pre></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = {};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 2500);
}

async function api(path, body) {
  const opts = body ? { method: "POST", body: JSON.stringify(body),
    headers: { "Content-Type": "application/json", "X-Requested-With": "ha-gitops" } } : {};
  const r = await fetch(path, opts);
  return r.json();
}

async function command(cmd, arg) {
  const r = await api("api/command", { command: cmd, arg: arg || "" });
  toast(r.result === "ok" ? `${cmd.replace("_", " ")} queued` : r.result);
  setTimeout(refresh, 800);
}

function stat(k, v) { return `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`; }

function renderState(s) {
  state = s;
  const st = $("#state"); st.textContent = s.state; st.className = `pill ${s.state}`;
  const pr = s.pr_url ? `<a href="${esc(s.pr_url)}" target="_blank" rel="noopener">#${esc(s.pr_number || "?")}</a>
    <span class="pill ${esc(s.pr_checks)}">${esc(s.pr_checks)}</span>` : '<span class="muted">none</span>';
  const when = s.last_run ? new Date(s.last_run).toLocaleString() : "never";
  $("#stats").innerHTML =
    stat("Last result", esc(`${s.detail || "–"} ${s.extra && !s.extra.startsWith("http") ? s.extra : ""}`)) +
    stat("Last run", `${esc(when)}<div class="muted">${esc(s.trigger || "")}</div>`) +
    stat("Open PR", pr) +
    stat("Pending files", esc(s.pending)) +
    stat("Local / remote", `<span class="sha">${esc((s.local_head || "–").slice(0, 7))} / ${esc((s.remote_head || "–").slice(0, 7))}</span>`) +
    stat("Last apply", esc(s.applied || "none")) +
    stat("Sync mode", esc(s.sync_mode) + (s.webhook ? " · webhook on" : ""));
  $("#pause").textContent = s.paused ? "Resume automatic sync" : "Pause automatic sync";
  $("#apply").textContent = s.auto_apply ? "Auto-apply: on" : "Auto-apply: off";
  document.querySelectorAll("[data-cmd]").forEach((b) => (b.disabled = s.running));
}

function renderDiff(d) {
  $("#files").innerHTML = d.files.length
    ? `<table>${d.files.map((f) => `<tr><td class="sha">${esc(f.slice(0, 2))}</td><td>${esc(f.slice(3))}</td></tr>`).join("")}</table>`
    : '<span class="muted">No changes: the box matches the base branch.</span>';
  $("#diff").innerHTML = esc(d.diff || "No diff for tracked files.").split("\n").map((l) =>
    l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>` :
    l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>` : l).join("\n");
}

function renderHistory(h) {
  $("#history").innerHTML = h.commits.map((c, i) => `<tr>
    <td class="sha"><a href="${esc(h.repo_url)}/commit/${esc(c.sha)}" target="_blank" rel="noopener">${esc(c.sha.slice(0, 7))}</a></td>
    <td>${esc(c.subject)}<div class="muted">${esc(c.author)} · ${esc(new Date(c.date).toLocaleString())}</div></td>
    <td>${i === h.commits.length - 1 ? "" : `<button data-revert="${esc(c.sha)}">Revert…</button>`}</td></tr>`).join("");
}

async function refresh() {
  try {
    renderState(await api("api/state"));
    renderDiff(await api("api/diff"));
    if (!$("#tab-history").hidden) renderHistory(await api("api/history"));
    if (!$("#tab-log").hidden) {
      const l = await api("api/log");
      const pre = $("#log"); pre.textContent = l.lines.join("\n"); pre.scrollTop = pre.scrollHeight;
    }
  } catch (e) { toast("Could not reach the app"); }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.cmd) command(b.dataset.cmd);
  else if (b.id === "pause") command(state.paused ? "resume" : "pause");
  else if (b.id === "apply") command(state.auto_apply ? "auto_apply_off" : "auto_apply_on");
  else if (b.dataset.revert) {
    if (confirm(`Open a PR that reverts ${b.dataset.revert.slice(0, 7)}? Nothing changes on the box until you merge it.`))
      command("revert", b.dataset.revert);
  } else if (b.dataset.tab) {
    document.querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", t === b));
    $("#tab-history").hidden = b.dataset.tab !== "history";
    $("#tab-log").hidden = b.dataset.tab !== "log";
    refresh();
  }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
